# Inference gateway in front of vLLM replicas; replica "canary-0" runs the new checkpoint and is ramped by SLO.
apiVersion: apps/v1
kind: Deployment
metadata: {name: kiln-gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: kiln-gateway}}
  template:
    metadata:
      labels: {app: kiln-gateway}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/priyanshu-singh/kiln:latest
          args:
            - gateway
            - --replica=base-0=http://vllm-base-0:8000
            - --replica=base-1=http://vllm-base-1:8000
            - --replica=base-2=http://vllm-base-2:8000
            - --replica=canary-0=http://vllm-canary-0:8000
            - --canary=canary-0
            - --p99-slo-s=0.5
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: "4", memory: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: kiln-gateway}
spec: {selector: {app: kiln-gateway}, ports: [{port: 80, targetPort: 8080}]}
