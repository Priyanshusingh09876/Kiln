[build-system]
requires = ["setuptools>=68", "wheel", "torch>=2.4", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln-rl"
version = "0.3.0"
description = "Kiln: a fully-asynchronous LLM post-training and serving stack (GRPO/PPO/DPO, FSDP2, Ray, vLLM/SGLang, fused Triton kernels)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Priyanshu Singh", email = "ps2001@bu.edu" }]
keywords = ["reinforcement-learning", "llm", "grpo", "ppo", "fsdp", "triton", "vllm", "ray", "inference"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4",
  "numpy>=1.24",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "typer>=0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
train = ["transformers>=4.44", "safetensors>=0.4", "datasets>=2.20", "accelerate>=0.33"]
ray = ["ray[default]>=2.30"]
vllm = ["vllm>=0.6"]
sglang = ["sglang>=0.3", "httpx>=0.27"]
reward = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "sympy>=1.12"]
triton = ["triton>=3.0"]
dev = ["pytest>=8.0", "pytest-timeout", "ruff>=0.5", "mypy>=1.10", "pre-commit", "fastapi", "httpx"]
all = ["kiln-rl[train,ray,vllm,reward,triton,dev]"]

[project.scripts]
kiln = "kiln.cli:main"

[project.urls]
Homepage = "https://github.com/Priyanshusingh09876/Kiln"
Documentation = "https://github.com/Priyanshusingh09876/Kiln/tree/main/docs"

[tool.setuptools.packages.find]
include = ["kiln*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
timeout = 300
markers = [
  "gpu: requires a CUDA device",
  "slow: long-running test",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
